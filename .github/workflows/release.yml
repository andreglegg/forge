name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - uses: actions/checkout@v7
        if: ${{ steps.release.outputs.release_created }}
        with:
          ref: ${{ steps.release.outputs.tag_name }}

      - uses: actions/setup-node@v7
        if: ${{ steps.release.outputs.release_created }}
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - run: npm ci
        if: ${{ steps.release.outputs.release_created }}

      - run: npm run check
        if: ${{ steps.release.outputs.release_created }}

      - run: npm run build
        if: ${{ steps.release.outputs.release_created }}

      - run: npm publish --access public
        if: ${{ steps.release.outputs.release_created }}

      - name: Smoke published npm package
        if: ${{ steps.release.outputs.release_created }}
        env:
          FORGE_TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          set -euo pipefail
          VERSION="${FORGE_TAG#v}"

          for attempt in $(seq 1 12); do
            if npm view "@aglegg/forge-harness@$VERSION" version --registry=https://registry.npmjs.org/ >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "Timed out waiting for @aglegg/forge-harness@$VERSION to appear on npm." >&2
              exit 1
            fi
            sleep 5
          done

          export npm_config_cache="$RUNNER_TEMP/forge-public-smoke-cache"
          SMOKE_REPO="$RUNNER_TEMP/forge-public-smoke-repo"
          mkdir -p "$SMOKE_REPO"
          printf '{"scripts":{"test":"node --test"}}\n' > "$SMOKE_REPO/package.json"

          ACTUAL="$(
            cd "$SMOKE_REPO"
            npm exec --yes --package="@aglegg/forge-harness@$VERSION" -- forge --version
          )"
          test "$ACTUAL" = "$VERSION"

          (
            cd "$SMOKE_REPO"
            npm exec --yes --package="@aglegg/forge-harness@$VERSION" -- forge help
          ) | grep -F "Quick start:"
          (
            cd "$SMOKE_REPO"
            npm exec --yes --package="@aglegg/forge-harness@$VERSION" -- forge config --json
          ) | grep -F "\"version\": \"$VERSION\""
