name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - uses: actions/checkout@v7
        if: ${{ steps.release.outputs.release_created }}
        with:
          ref: ${{ steps.release.outputs.tag_name }}

      - uses: actions/setup-node@v7
        if: ${{ steps.release.outputs.release_created }}
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - run: npm ci
        if: ${{ steps.release.outputs.release_created }}

      - run: npm run check
        if: ${{ steps.release.outputs.release_created }}

      - run: npm run build
        if: ${{ steps.release.outputs.release_created }}

      - run: npm publish --access public
        if: ${{ steps.release.outputs.release_created }}

      - name: Smoke published npm package
        if: ${{ steps.release.outputs.release_created }}
        env:
          FORGE_TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          set -euo pipefail
          VERSION="${FORGE_TAG#v}"

          for attempt in $(seq 1 24); do
            SMOKE_REPO="$RUNNER_TEMP/forge-public-smoke-repo-$attempt"
            mkdir -p "$SMOKE_REPO"
            printf '{"private":true,"scripts":{"test":"node --test"}}\n' > "$SMOKE_REPO/package.json"
            export npm_config_cache="$RUNNER_TEMP/forge-public-smoke-cache-$attempt"

            if (
              cd "$SMOKE_REPO"
              npm install --ignore-scripts --no-audit --no-fund --save-exact "@aglegg/forge-harness@$VERSION" --registry=https://registry.npmjs.org/
            ); then
              break
            fi
            if [ "$attempt" -eq 24 ]; then
              echo "Timed out waiting for @aglegg/forge-harness@$VERSION to be installable from npm." >&2
              exit 1
            fi
            sleep 5
          done

          export PATH="$SMOKE_REPO/node_modules/.bin:$PATH"
          ACTUAL="$(cd "$SMOKE_REPO" && forge --version)"
          test "$ACTUAL" = "$VERSION"

          (cd "$SMOKE_REPO" && forge help) | grep -F "Quick start:"
          (cd "$SMOKE_REPO" && forge config --json) | grep -F "\"version\": \"$VERSION\""
